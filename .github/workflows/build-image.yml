name: build-image

on:
  push:
    branches: [main]
    paths: [Dockerfile, src/**, tools/fp8_convert.py, .github/workflows/build-image.yml]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/magohl/qwen38-flash-dgx

jobs:
  build:
    # Native arm64: the Dockerfile compiles a CUDA kernel (sm_121a) and the GB10 is aarch64.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:v0.30
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
